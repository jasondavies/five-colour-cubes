version: "v0.4"
project:
  name: "Sharp thresholds for five-colour cube assemblies"
  description: >-
    A computer-assisted proof, fully formalised in Lean, that every collection
    of fifteen five-colour cubes contains eight forming a five-colour corner
    solution, with an elementary fourteen-cube counterexample. The proof
    includes physical geometry, Hall reduction, root coverage, budget
    projection, complete replay of 279 certificates, and final sharpness assembly.
    An eleven-cube fixed-missing-pair lemma and a rare-pair Hall argument give
    the exact frame function max(15,12n-16) for n >= 2, including twenty cubes
    for a 3-frame, and the exact complete-cube threshold
    max(n^3,15) for n >= 2. Exact corner thresholds by support
    size and a 21-member obstruction family are also formalised. For all
    a,b,c >= 2, the exact cuboid frame and complete-box thresholds are
    max(15,4(a+b+c)-16,2(a+b+c)+1) and max(abc,15,2(a+b+c)+1).
  authors: ["Jason Davies"]
  responsible_maintainers: ["Jason Davies"]
  license: "Apache-2.0"
