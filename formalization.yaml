# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"
project:
  name: "The sharp corner threshold for five-colour cubes"
  description: >-
    A computer-assisted proof, fully formalised in Lean, that every collection
    of fifteen five-colour cubes contains eight forming a five-colour corner
    solution, with an elementary fourteen-cube counterexample. The proof
    includes physical geometry, Hall reduction, root coverage, budget
    projection, complete replay of 279 certificates, and final sharpness assembly.
  authors: ["Jason Davies"]
  responsible_maintainers: ["Jason Davies"]
  license: "Apache-2.0"
repository:
  role: substantive-development
classification:
  arxiv: ["math.CO", "cs.LO"]
  msc2020: ["05C70", "68V15", "00A08"]
sources:
  - title: "The sharp corner threshold for five-colour cubes"
    authors: ["Jason Davies"]
    type: original-proof
    relationship: other
    id: "https://github.com/jasondavies/five-colour-cubes"
    location: "paper/five-colour-cubes.tex"
    note: "Working manuscript; not released or submitted."
  - title: "The 4-Color Cubes Puzzle"
    authors: ["Ethan Berkove", "Andrew Eickemeyer", "Michael Schulman"]
    type: article
    relationship: background
    id: "https://doi.org/10.5281/zenodo.10680216"
    location: "Integers 18 (2018), A68; Section 8, Table 7"
    note: "Lists the five-colour corner value as unknown."
    author_endorsement: not-contacted
related_formalizations:
  - id: "https://github.com/jasondavies/colour-cubes-core/tree/3164adbd2ee16d2721caadc1db67c1498e5d67e0"
    relationship: builds-on
    note: >-
      Shared palette-independent physical model, proper rotations, corner matching
      and rotation transport. The challenge imports only mathlib and locally
      restates the core definitions. No other paper's catalogue, threshold or
      classification theorem is imported.
status:
  scope: >-
    COMPLETE physical sharp-threshold formalisation. Lean proves completeness
    and uniqueness of the 75 varieties, all 45,000 compatibility bits, the
    fourteen-cube obstruction, physical matching/Hall equivalence, multiplicity
    and symmetry transport, anchor selection, two-variety bounds, shared-corner
    exclusion and complete coverage by 357 integer root problems. The packed
    arithmetic and certificate checker are proved sound, including all 19,125
    cut calibrations and bounded chunk composition. Checked containments and
    initial budget bounds leave 279 roots; the Hall-budget projection reduces
    their totals and budgets while preserving every target failure. All
    projected headers, bounds and constraint families are identified with
    their integer models. All 279 projected certificates (499,829 instructions)
    have passed Lean kernel replay. The final assembly proves unconditional
    Physical.Threshold15 and Physical.SharpThreshold15 via
    Packed.ProjectedChunks.threshold15 and sharpThreshold15. Their axiom audit
    contains only propext, Classical.choice and Quot.sound.
    The default target builds the infrastructure and selected cases; full
    generated replay is opt-in and reproducible from the committed archive.
    Solution.lean transfers the result to the Mathlib-only geometric challenge
    and builds successfully. The latest full external comparator run ended
    without a recorded outcome; a full pass remains unconfirmed.
    No Palomar submission exists. The five intentional theorem holes in
    Challenge.lean are comparator targets, excluded from the proof-source counts below.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
    - method: agent
      models: ["GPT-6-Astra (OpenAI)"]
      framework: "Codex"
      tool_setup: >-
        Under the author's direction, investigated the five-colour threshold,
        developed multicore C++ searches and separate geometric checks,
        derived the lower-bound and case-cover arguments, generated interval
        certificates, proved the Lean checking infrastructure, and prepared
        the manuscript and package. No GPU was used.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local CPU"
      prompting_notes: "Publishable research, efficient compiled solvers, Lean formalisation and a standalone paper repository."
  spend_usd: "not tracked"
  notes: >-
    GPT-6-Astra (OpenAI), used through Codex, developed the research and
    manuscript under Jason Davies's direction. Author review and submission
    approval of this draft are pending. Upstream geometry has the separate
    attribution recorded in its pinned repository. No other model is claimed
    as a contributor to this manuscript. No native_decide is used.
fidelity:
  divergences: >-
    Both the paper and Lean prove the complete physical sharp threshold.
    The lower bound in Lean uses 75 kernel-checked deficient corner sets,
    rather than the paper's elementary classification of the three possible
    targets. The upper bound formalises the physical reduction and budget
    projection, then checks all 279 projected interval certificates and their
    final composition. Generated replay sources are ignored and reproducible;
    logs are transient build outputs. No human peer review or publication-priority
    claim is made.
review:
  status: "Automated checks and AI review only; author and independent human review pending"
