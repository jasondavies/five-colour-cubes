fidelity:
  divergences: >-
    Both the paper and Lean prove the complete physical sharp threshold.
    The lower bound in Lean uses 75 kernel-checked deficient corner sets,
    rather than the paper's elementary classification of the three possible
    targets. The upper bound formalises the physical reduction and budget
    projection, then checks all 279 projected interval certificates and their
    final composition. Generated replay sources are retained and reproducible;
    logs are transient build outputs. For the extensions, Lean uses generic
    Hall and reservation lemmas with kernel-checked finite geometry bounds.
    The fixed-missing-pair lemma uses a checked nine-variety compatibility
    pattern and ten Hall inequalities per target, then arithmetic on arbitrary
    multiplicities. It does not enumerate eleven-copy collections; the separate
    C++ enumeration is a supplementary audit.
    It checks support-pair witnesses directly rather than reducing them to
    five colour-permutation orbits. For cuboids, the eight-plus-three proof
    obtains a small cover directly from a failed Hall inequality. Finite
    projection and directional profile checks replace geometric case tables.
    The directional, rod and strip checks use two canonical targets, with
    proved colour and rotation transport for sources, corners, edges and axes.
    Half-mask placement is greedy after checked single-mask intersection bounds;
    arbitrary multiplicities and side lengths are handled by matching and
    arithmetic lemmas. The uniform obstruction uses kernel-checked private
    corner and directional edge counts. No new interval certificates are used.
    The compressed flow construction and its complexity bound are proved
    in the manuscript, not formalised in Lean.
    The full source and generated-proof verification route is make verify-full;
    its provenance extract is retained in verification/optimized-full.json.
    This 8 November run passed on the revised projection sources using
    Lake-validated caches and built Solution, including the classification.
    The separate classification data checks and eight-declaration audit passed
    in the same frozen pipeline. External comparison is recorded separately.
    The classification endpoint proves 56 concrete classes; the symbolic
    51+4+1 normal forms and 11,430 labelled inventories follow from manuscript
    arguments and the independent normal-form/orbit audit. The short deletion
    proof of the threshold is a manuscript deduction; the exported threshold
    keeps its independent 279-certificate route.
    The comparison extract and complete output are retained alongside it.
    Extracts retain source hashes and the raw-record checksum, omitting local
    paths and process metadata. Raw run records stay under ignored build/.
review:
