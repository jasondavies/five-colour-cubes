version: "v0.4"
project:
  name: "The sharp corner threshold for five-colour cubes"
  description: >-
    A computer-assisted proof that every collection of fifteen five-colour
    cubes contains eight forming a five-colour corner solution, with an
    elementary fourteen-cube counterexample. The Lean development is partial:
    it proves interval and packed checker soundness, chunk composition,
    calibration, selected case exclusions, physical catalogue and incidence
    correctness, the fourteen-cube lower bound, the physical Hall/multiplicity
    bridge to packed target constraints, the anchor budget, global symmetry
    transport, the two anchor orbits, two-variety capacities, anchor selection,
    the shared-corner exclusion and complete physical coverage by the integer
    root problems, and their equivalence to the packed archive cases.
    The full replay and final physical threshold assembly remain unchecked.
  authors: ["Jason Davies"]
  responsible_maintainers: ["Jason Davies"]
  license: "Apache-2.0"
repository:
  role: substantive-development
