fidelity:
  divergences: >-
    The paper proves the sharp threshold by an elementary lower bound and
    a computer-assisted upper bound with complete C++ certificate replay.
    Lean proves the checking machinery, selected finite exclusions, physical
    catalogue/incidence correctness, the fourteen-cube obstruction, physical
    Hall and multiplicity equivalence to the packed target constraints, and
    the anchor Hall lemma, global symmetry transport, anchor normalisation,
    two-variety capacities, anchor selection, the shared-corner exclusion,
    complete physical coverage by the integer root problems, and exact
    equivalence of all packed archive cases to those models. The
    lower bound uses 75 kernel-checked deficient corner sets, rather than the
    paper's elementary classification of the three possible targets. Lean
    does not yet prove the paper's complete physical threshold theorem.
    Full generated replay sources are ignored and reproducible; logs are transient build
    outputs. No human peer review or publication-priority claim is made.
review:
  status: "Automated checks and AI review only; author and independent human review pending"
