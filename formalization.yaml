status:
  scope: >-
    COMPLETE physical sharp-threshold formalisation. Lean proves completeness
    and uniqueness of the 75 varieties, all 45,000 compatibility bits, the
    fourteen-cube obstruction, physical matching/Hall equivalence, multiplicity
    and symmetry transport, anchor selection, two-variety bounds, shared-corner
    exclusion and complete coverage by 357 integer root problems. The packed
    arithmetic and certificate checker are proved sound, including all 19,125
    cut calibrations and bounded chunk composition. Checked containments and
    initial budget bounds leave 279 roots; the Hall-budget projection reduces
    their totals and budgets while preserving every target failure. All
    projected headers, bounds and constraint families are identified with
    their integer models. All 279 projected certificates (298,167 instructions)
    have passed Lean kernel replay. The final assembly proves unconditional
    Physical.Threshold15 and Physical.SharpThreshold15 via
    Packed.ProjectedChunks.threshold15 and sharpThreshold15. Their axiom audit
    contains only propext, Classical.choice and Quot.sound.
    The default Lake target builds the infrastructure and checkpoint controls; full
    generated replay is opt-in, retained for clean Lake builds, and reproducible
    from the committed archive.
    The extension library proves the rare-pair Hall argument, the physical
    frame and complete-cube deductions, the sharp two-variety bound of thirteen,
    and a family of fourteen-cube obstructions. Finite kernel checks cover the
    source-target compatibility bounds, missing-pair classification and
    small-support witnesses; no new interval certificates are needed.
    The extremal extension independently proves the multiplicity-five bound,
    the complete five-class classification of three-variety fourteen-cube
    obstructions and the exact generalized-family obstruction criterion. Its formal route uses
    kernel-checked finite allocations, private-position criteria and symmetry reductions, while the paper
    gives elementary geometric proofs. Completeness, failure of every listed
    representative and inequivalence under common colour relabelling and
    simultaneous reflection are all included. This extension does not import
    Threshold15 or depend on interval-certificate replay.
    Solution.lean applies the unconditional threshold to prove frame_bound,
    frame_threshold, frame_threshold_all, frame20, full_cube, full_cube27, full_cube64, complete_cube_threshold and
    support_threshold, audited by ExtensionsAudit.lean. BoxThresholds.lean
    proves necessary and sufficient pool sizes for every cuboid. The cube
    results specialise these theorems through CubeBoxBridge.lean, whose
    position equivalences preserve compatibility and physical placements.
    FullCube.lean also reuses the rectangular completion construction.
    The physical
    eight-plus-three lemma, weighted directional bounds, concentration and
    retargeting arguments, uniform three-variety obstruction and completion
    are kernel-checked. Solution.lean exports box_frame_threshold and
    complete_box_threshold, plus box223, box224 and box233. Audit.lean covers
    the shared proof declarations; ExtensionsAudit.lean covers unconditional
    extension and submission-interface statements.
    Solution.lean transfers the results to a Mathlib-only geometric Challenge.
    Its sixteen comparison targets include the corner threshold and sharpness,
    both cuboid thresholds, support thresholds, multiplicity bound, five-class
    classification, representative failure and inequivalence, and generalized
    obstruction family, the universal minimum and cyclic construction, and
    the complete 56-class classification.
    Universal.lean proves both bounds independently of the interval archive.
    UniversalStructure.lean proves that every minimum universal collection
    has distinct adjacent-repeat varieties and a spanning tree of smaller pairs
    for each repeated colour; this corollary is outside the comparator interface.
    The complete 56-representative classification is proved independently of
    the fifteen-cube theorem. Its 349-root route contains 713,099 instructions:
    329 exclusions, thirteen core-cover/extension groups and seven terminal
    enumerations. Complete Lean replay and the physical-endpoint axiom audit
    passed; verification/classification.json identifies the proof sources.
    The sixteen-claim external comparator includes this physical classification.
    The independent Challenge defines physical rotation
    classes and copy counts without importing the catalogue. Its cuboid slots
    explicitly represent corners, edges, face interiors and interior positions.
    SubmissionBridge.lean proves agreement with the proof models.
    All sixteen statements, shared definitions and permitted axioms passed
    local comparison on 9 November 2026. Both NanoDa and Lean's standalone
    kernel accepted the complete export. The comparison took 37967.690 seconds
    using validated Lake artifacts, excluding a fresh project build.
    verification/optimized-comparator.json identifies source snapshot
    940980304874bf067ea978c4a2251381be6cb0fea2cf6ffa0fca7b97303c3f2c,
    actual dependency trees and tool identities. The output and outer-driver
    resource report are optimized-comparator-output.txt and
    optimized-comparator-resources.txt in verification/; optimized-full.json
    contains a sanitized extract of the preceding successful project verification.
    Its Lean proof sources and certificate inputs match the publication sources.
    Documentation and publication records were updated after the run.
    The duration is an observed run time, not a controlled performance comparison.
    The structural
    minimum-universal corollary is checked by the ordinary Lean build and axiom
    audit but is outside the comparator interface.
    The sixteen intentional theorem holes in
    Challenge.lean are comparator targets, excluded from the proof-source counts below.
  sorry_count: 0
