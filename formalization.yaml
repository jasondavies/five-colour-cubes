status:
  scope: >-
    INCOMPLETE physical formalisation. Proved: reference interval checker
    soundness, base-1024 arithmetic and semantic bridge, packed checker
    soundness, all 19,125 cut-weight calibrations, bounded chunk composition,
    selected case exclusions, completeness and uniqueness of the 75 physical
    varieties, all 45,000 incidence bits, rotation transport, and the physical
    fourteen-cube lower-bound theorem. Also proved: physical matching/Hall
    equivalence, exact multiplicity transport, the bound of seven copies per
    variety, agreement of all 19,125 packed masks and deficiency bounds with
    physical Hall cuts, and the anchor Hall budget. Global colour permutations
    and reflection preserve solvability, multiplicities and anchor budgets;
    the two colour orbits (60 adjacent, 15 opposite varieties) and their chosen
    representatives are certified. Two-variety capacity bounds and all 26,775
    exported upper bounds are checked, giving root-box membership under the
    anchor, class and Hall-budget premises. Explicit physical symmetry witnesses
    reduce all 1,537 eligible cover/multiplicity combinations to exported roots.
    Anchor selection and the shared-corner exclusion are proved, completing
    the reduction of every fifteen-cube physical counterexample to an admissible
    vector in one of the 357 integer root problems. All 357 archived headers,
    packed bounds and decoded constraint families are identified with those
    integer models. The threshold and sharp threshold are derived conditionally
    on the concrete archive exclusions, and a final assembly is generated.
    Complete archive replay and verification of that assembly remain unfinished;
    the full physical threshold remains unproved.
    Physical.Threshold15 and Physical.SharpThreshold15 are target propositions,
    not proved theorems. A Mathlib-only geometric comparator challenge and its
    proved bridge are supplied; the upper-bound transfers are conditional on
    Physical.Threshold15. The full comparator solution has not been checked,
    and no Palomar submission exists. The five intentional theorem holes in
    Challenge.lean are comparator targets, excluded from the proof-source counts below.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
